services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      OBJECT_STORE_PATH: /data/object-events.jsonl
    volumes:
      - smart-glasses-object-data:/data

  agent-runtime:
    profiles: [scaffolds]
    build:
      context: ./services/agent-runtime
    ports:
      - "8081:8081"
    environment:
      AGENT_RUNTIME_PORT: 8081

  render-worker:
    profiles: [scaffolds]
    build:
      context: ./services/render-worker
    ports:
      - "8082:8082"
    environment:
      RENDER_WORKER_PORT: 8082

  publisher-worker:
    profiles: [scaffolds]
    build:
      context: ./services/publisher-worker
    ports:
      - "8083:8083"
    environment:
      PUBLISHER_WORKER_PORT: 8083

volumes:
  smart-glasses-object-data:

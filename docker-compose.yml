services:
  api:
    build:
      context: ./services/api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_PORT: 8080

  agent-runtime:
    build:
      context: ./services/agent-runtime
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      AGENT_RUNTIME_PORT: 8081

  render-worker:
    build:
      context: ./services/render-worker
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      RENDER_WORKER_PORT: 8082

  publisher-worker:
    build:
      context: ./services/publisher-worker
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      PUBLISHER_WORKER_PORT: 8083

name: Monthly retained snapshot

on:
  schedule:
    - cron: "31 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create monthly snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          month="$(date -u +%Y-%m)"
          tag="snapshot-${month}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Monthly snapshot already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Monthly snapshot ${month}" \
            --notes "Immutable monthly recovery snapshot from main at ${GITHUB_SHA}. This is not a production deployment receipt."

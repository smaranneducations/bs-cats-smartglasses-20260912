name: Smart Glasses CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bootstrap-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          test -f .env.template || exit 1
          test -f docker-compose.yml || exit 1
          test -f services/api/src/main.py || exit 1
          test -f services/agent-runtime/main.py || exit 1
          test -f services/render-worker/main.py || exit 1
          test -f services/publisher-worker/main.py || exit 1
          echo "Core files present"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for dependency-free audience tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test audience states and feedback acknowledgements
        run: node --test tests/test_*.cjs
      - name: Install contract dependencies
        run: |
          python -m pip install -r packages/contracts/requirements.txt
          python -m pip install -r services/api/requirements.txt
          python -m pip install -r scripts/requirements-demo.txt
      - name: Run offline governance checks
        run: |
          PYTHONDONTWRITEBYTECODE=1 python scripts/validate_change_summary.py --event "$GITHUB_EVENT_PATH"
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -p "test_*.py" -v
          PYTHONDONTWRITEBYTECODE=1 python scripts/secret_scan.py --mode tracked
          PYTHONDONTWRITEBYTECODE=1 python scripts/repository_publication_guard.py --mode tracked
      - name: Validate contract schema imports
        working-directory: packages/contracts
        run: |
          python -m py_compile object.py store.py smart_glasses.py research.py content.py __init__.py

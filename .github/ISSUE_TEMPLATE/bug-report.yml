name: Bug report
description: Report reproducible behavior that differs from the documented contract.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include sanitized IDs and versions, but no credentials or private data.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and containment
      description: State affected personas, data, releases, costs, and any safe workaround.
    validations:
      required: true
